<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Daftar Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <!-- JOBSHEET 5: Menggunakan button asli untuk hamburger menu JS -->
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Buku</a></li>
                <li><a href="tambah.html">Tambah Buku</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
                <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Daftar Buku</h2>
            <!-- JOBSHEET 5 Kolom Pencarian  -->
            <div class="search-box">
                <label for="search-input">Cari Judul Buku</label>
                <input type="text" id="search-input" placeholder="Ketik judul buku...">
            </div>
            <!-- Latihan 1: Tombol Muat Ulang Baru -->
            <button type="button" id="btn-muat-ulang" style="margin-bottom: 1rem;">Muat Ulang Data</button>
            <!-- jobsheet 6 -->
            <p id="loading-indicator" style="display:none;">Memuat data...</p>
            <div class="table-responsive"> <!-- Menambahkan div dengan class "table-responsive" untuk membuat tabel dapat di-scroll secara horizontal pada tampilan mobile -->
                <table>
                    <thead>
                        <tr>
                            <th>Judul</th>
                            <th>Pengarang</th>
                            <th>Tahun</th>
                            <th>Stok</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <! jobsheet 6: Baris diisi dinamis oleh assets/js/buku.js via fetch('../data/buku.json') -->
                        <!-- Baris diisi dinamis oleh assets/js/buku.js via fetch('../data/buku.json') -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p>
    </footer>
    <!-- JOBSHEET 5: Menghubungkan script interaktivitas JS -->
    <script src="../assets/js/app.js"></script>
    <!-- JOBSHEET 6: Menghubungkan script interaktivitas JS untuk buku -->
    <script src="../assets/js/buku.js"></script>
</body>
</html>
